name: Release - signed Android TV APKs

# A single click bumps versionName/versionCode, builds signed APKs and publishes
# them directly in GitHub Releases. No Actions artifacts are created here.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-android-tv
  cancel-in-progress: false

jobs:
  release:
    name: Auto-bump, build, verify and publish TV release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require trusted default branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/dev' ]; then
            echo '::error::Choose the dev branch when dispatching a release.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: true

      - name: Calculate the next version and bump Android versionCode
        id: version
        run: |
          set -euo pipefail
          python3 tools/tv_release_version.py --catalog gradle/libs.versions.toml --github-output "$GITHUB_OUTPUT"

      - name: Refuse an existing release or tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists; refusing to replace it."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace it."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare TV signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tv-release.jks"
          python3 tools/release_properties.py "$RUNNER_TEMP/tv-signing.properties"

      - name: Build signed TV release APKs
        run: |
          chmod +x gradlew
          ./gradlew :tvAndroidApp:assembleRelease "-PtvSigning=$RUNNER_TEMP/tv-signing.properties" --no-daemon --max-workers=2

      - name: Verify signatures on every APK
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(tvAndroidApp/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::No TV release APKs were produced.'
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in "${apks[@]}"; do
            python3 -c 'import sys; from tools.tv_signing import verify_apk; verify_apk(sys.argv[1], sys.argv[2])' "$apk" "$apksigner"
            echo "Verified TV certificate: $(basename "$apk")"
          done

      # Only persist a new version after the APKs are confirmed buildable and
      # signed. A non-fast-forward push fails safely if dev changed mid-build.
      - name: Commit verified version bump to dev
        id: target
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          NEEDS_COMMIT: ${{ steps.version.outputs.needs_commit }}
        run: |
          set -euo pipefail
          if [ "$NEEDS_COMMIT" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- gradle/libs.versions.toml
            git commit -m "chore(tv-release): bump to $RELEASE_TAG [skip ci]"
            git push origin HEAD:dev
          else
            echo 'Resuming an earlier verified bump that has not been tagged.'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with signed APK assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.target.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(tvAndroidApp/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::No signed APKs to publish.'
            exit 1
          fi
          args=(--title "SimpMusic Android TV $RELEASE_TAG" --target "$RELEASE_SHA" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${apks[@]}" "${args[@]}"
          gh release view "$RELEASE_TAG" --json url,assets

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tv-release.jks" "$RUNNER_TEMP/tv-signing.properties"
